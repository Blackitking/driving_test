<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تاقیکردنەوەی شۆفێری</title>

<style>
body {
    font-family: Arial, sans-serif;
    direction: rtl;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    color: #222;
}

.question {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.answer {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    background: #eeeeee;
    font-size: 17px;
    cursor: pointer;
}

.answer:hover {
    background: #dddddd;
}

.correct {
    background: #4caf50 !important;
    color: white;
}

.wrong {
    background: #f44336 !important;
    color: white;
}

button#next {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: #1976d2;
    color: white;
    font-size: 18px;
}

#result {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🚗 تاقیکردنەوەی شۆفێری</h1>

<div id="quiz">

<div class="question" id="question"></div>

<div id="answers"></div>

<button id="next" onclick="nextQuestion()">پرسیاری داهاتوو ➜</button>

</div>

<div id="result"></div>

</div>

<script>

const questions = [

{
question: "کاتێک چرای سووری ترافیک دەبینیت، چی دەکەیت؟",
answers: [
"دەوەستم",
"بەخێرایی تێدەپەڕم",
"دەخەمە گێڕی دووەم"
],
correct: 0
},

{
question: "کاتێک پیاوێک لەسەر پەڕینگەی پیاوانەیە، چی دەکەیت؟",
answers: [
"خێراتر دەڕۆم",
"دەوەستم و ڕێگەی پێ دەدەم",
"بوقی لێ دەکەم"
],
correct: 1
},

{
question: "لە شەقامێکی تەنگدا کێ پێشینەیی هەیە؟",
answers: [
"ئەو ئۆتۆمبێلەی دێت بەرامبەر",
"ئەوەی پێشتر گەیشتووە",
"هەردووکیان"
],
correct: 1
},

{
question: "کاتێک باران زۆر دەبارێت، چی باشترە؟",
answers: [
"خێرایی زیاد بکەیت",
"خێرایی کەم بکەیت",
"چرای ئۆتۆمبێل بکوژێنیتەوە"
],
correct: 1
},

{
question: "بۆچی پێویستە کەمربەند ببەستیت؟",
answers: [
"بۆ پاراستنی ژیان",
"بۆ زیادکردنی خێرایی",
"بۆ کەمکردنی سووتەمەنی"
],
correct: 0
}

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function showQuestion() {

answered = false;

let q = questions[currentQuestion];

document.getElementById("question").innerText =
(currentQuestion + 1) + ". " + q.question;

let answersDiv = document.getElementById("answers");

answersDiv.innerHTML = "";

q.answers.forEach((answer, index) => {

let button = document.createElement("button");

button.innerText = answer;
button.className = "answer";

button.onclick = function() {

if (answered) return;

answered = true;

if (index === q.correct) {

button.classList.add("correct");
score++;

} else {

button.classList.add("wrong");

answersDiv.children[q.correct].classList.add("correct");

}

};

answersDiv.appendChild(button);

});

}

function nextQuestion() {

if (!answered) {
alert("تکایە یەک وەڵام هەڵبژێرە!");
return;
}

currentQuestion++;

if (currentQuestion < questions.length) {

showQuestion();

} else {

document.getElementById("quiz").style.display = "none";

document.getElementById("result").innerHTML =
"🎉 تاقیکردنەوە تەواو بوو!<br><br>" +
"نمرەکەت: " + score + " / " + questions.length;

}

}

showQuestion();

</script>

</body>
</html>
