<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>

<title>تاقیکردنەوەی تیۆری مۆڵەتی شوفێری</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  min-height:100vh;
  color:#111827;
}

.container{
  width:94%;
  max-width:700px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:22px;
  padding:24px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.hidden{
  display:none!important;
}

h1,h2,h3{
  text-align:center;
}

.logo{
  text-align:center;
  font-size:55px;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  line-height:1.8;
}

.language-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}

.lang-btn{
  border:0;
  padding:18px 10px;
  border-radius:15px;
  background:#f1f5f9;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.lang-btn:hover{
  background:#dbeafe;
}

.primary-btn{
  width:100%;
  border:0;
  padding:16px;
  border-radius:15px;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

.primary-btn:hover{
  background:#1d4ed8;
}

input{
  width:100%;
  padding:15px;
  border:2px solid #cbd5e1;
  border-radius:14px;
  font-size:17px;
  outline:none;
  margin-top:10px;
}

input:focus{
  border-color:#2563eb;
}

.info{
  line-height:2;
  background:#eff6ff;
  padding:15px;
  border-radius:15px;
  margin-top:20px;
}

.contact{
  text-align:center;
  margin-top:15px;
  line-height:2;
}

.contact a{
  text-decoration:none;
  font-weight:bold;
  margin:0 7px;
}

.whatsapp{
  color:#16a34a;
}

.viber{
  color:#7c3aed;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.timer{
  background:#fee2e2;
  color:#dc2626;
  padding:10px 15px;
  border-radius:13px;
  font-size:20px;
  font-weight:bold;
  min-width:80px;
  text-align:center;
}

.progress{
  height:9px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.progress-bar{
  height:100%;
  background:#2563eb;
  width:0%;
  transition:.3s;
}

.question-numbers{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:20px;
  justify-content:center;
}

.qnum{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#cbd5e1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

.qnum.current{
  outline:3px solid #2563eb;
}

.qnum.correct{
  background:#16a34a;
  color:white;
}

.qnum.wrong{
  background:#000;
  color:white;
}

.question{
  font-size:21px;
  font-weight:bold;
  line-height:1.8;
  margin-bottom:20px;
}

.answers{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.answer-btn{
  width:100%;
  text-align:right;
  padding:16px;
  border:2px solid #d1d5db;
  border-radius:15px;
  background:#f8fafc;
  font-size:17px;
  cursor:pointer;
  line-height:1.6;
}

.answer-btn:hover{
  border-color:#2563eb;
  background:#eff6ff;
}

.answer-btn.selected{
  border-color:#2563eb;
  background:#dbeafe;
}

.answer-btn.correct-answer{
  border-color:#16a34a;
  background:#dcfce7;
}

.answer-btn.wrong-answer{
  border-color:#dc2626;
  background:#fee2e2;
}

.result{
  text-align:center;
}

.result-icon{
  font-size:70px;
}

.score{
  font-size:40px;
  font-weight:bold;
  margin:15px 0;
}

.pass{
  color:#16a34a;
}

.fail{
  color:#dc2626;
}

.wrong-list{
  margin-top:25px;
  text-align:right;
}

.wrong-item{
  background:#f8fafc;
  border-right:5px solid #dc2626;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  line-height:1.9;
}

.small{
  color:#64748b;
  font-size:14px;
}

@media(max-width:500px){
  .card{
    padding:18px;
  }

  .language-grid{
    grid-template-columns:1fr;
  }

  .question{
    font-size:19px;
  }

  .answer-btn{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- LANGUAGE -->
<section id="languageScreen" class="card">
  <div class="logo">🚗</div>
  <h1 id="chooseLanguage">تکایە زمانێک هەڵبژێرە</h1>

  <div class="language-grid">

      کوردی سۆرانی
    </button>

    <button class="lang-btn" onclick="selectLanguage('badini')">
      کوردی بادینی
    </button>

    <button class="lang-btn" onclick="selectLanguage('ar')">
      العربية
    </button>

    <button class="lang-btn" onclick="selectLanguage('en')">
      English
    </button>
  </div>
</section>


<!-- WELCOME -->
<section id="welcomeScreen" class="card hidden">

  <div class="logo">🚘</div>

  <h1 id="welcomeTitle"></h1>

  <div class="info">
    <p id="ownerText"></p>
    <p id="teacherText"></p>
    <p id="problemText"></p>
  </div>

  <div class="contact">
    <a class="whatsapp"

       target="_blank">
       🟢 WhatsApp
    </a>

    <a class="viber"

       🟣 Viber
    </a>
  </div>

  <button class="primary-btn" onclick="showNameScreen()" id="startBtn">
    دەست پێکردن

</section>


<!-- NAME -->
<section id="nameScreen" class="card hidden">

  <div class="logo">👤</div>

  <h2 id="nameTitle"></h2>

  <p class="subtitle" id="nameSub"></p>

  <input

  >

  <button

  </button>

</section>


<!-- QUIZ -->
<section id="quizScreen" class="card hidden">

  <div class="topbar">
    <strong id="questionCounter"></strong>
    <div class="timer" id="timer">60</div>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="question-numbers" id="questionNumbers"></div>

  <div class="question" id="questionText"></div>

  <div class="answers" id="answers"></div>

</section>


<!-- RESULT -->
<section id="resultScreen" class="card hidden">

  <div class="result">

    <div class="result-icon" id="resultIcon"></div>

    <h1 id="resultTitle"></h1>

    <div class="score" id="finalScore"></div>

    <p id="resultDetails"></p>

    <div class="wrong-list" id="wrongList"></div>

    <button
      class="primary-btn"
      onclick="newTest()"
      id="newTestBtn">
    </button>

  </div>

</section>

</div>

/* =========================================================
   VARIABLES
========================================================= */

let sessionQuestions=[];
let currentQuestion=0;
let scoreCorrect=0;
let wrongAnswers=[];
let timerInterval=null;
let timeLeft=60;
let userName="";


/* =========================================================
   RANDOM SHUFFLE
========================================================= */

function shuffle(array){
  const arr=[...array];

  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }

  return arr;
}


/* =========================================================
   GET 25 QUESTIONS
========================================================= */

function getSessionQuestions(){

  let remaining=[];

  try{
    remaining=JSON.parse(
      localStorage.getItem("remainingQuestions") || "[]"
    );
  }catch(e){
    remaining=[];
  }

  const allIds=questions.map(q=>q.id);

  if(!Array.isArray(remaining)){
    remaining=[];
  }

  remaining=remaining.filter(id=>allIds.includes(id));

  /*
    If fewer than 25 remain, create a new shuffled pool.
    This makes consecutive tests different as much as possible.
  */
  if(remaining.length<25){

    const lastSession=
      JSON.parse(
        localStorage.getItem("lastSession") || "[]"
      );

    const notLast=shuffle(
      allIds.filter(id=>!lastSession.includes(id))
    );

    const inRemaining=remaining.filter(
      id=>!lastSession.includes(id)
    );

    const combined=[
      ...inRemaining,
      ...notLast.filter(id=>!inRemaining.includes(id))
    ];

    remaining=shuffle(combined);

    /*
      If still less than 25, fill from all questions.
    */
    if(remaining.length<25){
      remaining=shuffle(allIds);
    }
  }

  const selected=remaining.slice(0,25);
  const newRemaining=remaining.slice(25);

  localStorage.setItem(
    "remainingQuestions",
    JSON.stringify(newRemaining)
  );

  localStorage.setItem(
    "lastSession",
    JSON.stringify(selected)
  );

  return selected.map(id =>
    questions.find(q=>q.id===id)
  );
}


/* =========================================================
   LANGUAGE SELECT
========================================================= */

function selectLanguage(lang){

  currentLanguage=lang;

  const t=translations[lang];

  document.documentElement.lang=
    lang==="ar" ? "ar" :
    lang==="en" ? "en" : "ku";

  document.documentElement.dir=t.dir;

  document.getElementById("chooseLanguage").textContent=t.choose;
  document.getElementById("chooseLanguageSub").textContent=t.chooseSub;

  document.getElementById("languageScreen")
    .classList.add("hidden");

  document.getElementById("welcomeScreen")
    .classList.remove("hidden");

  document.getElementById("welcomeTitle").textContent=t.welcome;
  document.getElementById("ownerText").textContent=t.owner;
  document.getElementById("teacherText").textContent=t.teacher;
  document.getElementById("problemText").textContent=t.problem;
  document.getElementById("startBtn").textContent=t.start;
}


/* =========================================================
   NAME SCREEN
========================================================= */

function showNameScreen(){

  const t=translations[currentLanguage];

  document.getElementById("welcomeScreen")
    .classList.add("hidden");

  document.getElementById("nameScreen")
    .classList.remove("hidden");

  document.getElementById("nameTitle").textContent=t.nameTitle;
  document.getElementById("nameSub").textContent=t.nameSub;
  document.getElementById("fullName").placeholder=t.namePlaceholder;
  document.getElementById("beginQuizBtn").textContent=t.begin;

  setTimeout(()=>{
    document.getElementById("fullName").focus();
  },200);
}


/* =========================================================
   START QUIZ
========================================================= */

function startQuiz(){

  const input=document.getElementById("fullName");

  userName=input.value.trim();

  if(!userName){

    input.focus();

    return;
  }

  sessionQuestions=getSessionQuestions();

  currentQuestion=0;
  scoreCorrect=0;
  wrongAnswers=[];

  document.getElementById("nameScreen")
    .classList.add("hidden");

  document.getElementById("quizScreen")
    .classList.remove("hidden");

  createQuestionNumbers();

  showQuestion();
}


/* =========================================================
   QUESTION NUMBERS
========================================================= */

function createQuestionNumbers(){

  const box=document.getElementById("questionNumbers");

  box.innerHTML="";

  for(let i=0;i<25;i++){

    const div=document.createElement("div");

    div.className="qnum";
    div.id="qnum-"+i;

    div.textContent=i+1;

    box.appendChild(div);
  }
}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion(){

  clearInterval(timerInterval);

  const t=translations[currentLanguage];
  const q=sessionQuestions[currentQuestion];

  document.querySelectorAll(".qnum")
    .forEach(x=>x.classList.remove("current"));

  const currentNumber=
    document.getElementById("qnum-"+currentQuestion);

  if(currentNumber){
    currentNumber.classList.add("current");
  }

  document.getElementById("questionCounter").textContent=
    `${t.question} ${currentQuestion+1} ${t.of} 25`;

  document.getElementById("progressBar").style.width=
    `${((currentQuestion)/25)*100}%`;

  document.getElementById("questionText").textContent=
    q.q;

  const answersBox=document.getElementById("answers");

  answersBox.innerHTML="";

  /*
    Shuffle answer choices while keeping the correct answer.
  */
  const choices=q.a.map((text,index)=>({
    text:text,
    originalIndex:index
  }));

  const shuffledChoices=shuffle(choices);

  shuffledChoices.forEach(choice=>{

    const button=document.createElement("button");

    button.className="answer-btn";

    button.textContent=choice.text;

    button.onclick=()=>{
      answerQuestion(
        choice.originalIndex,
        button
      );
    };

    answersBox.appendChild(button);
  });

  startTimer();
}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  timeLeft=60;

  updateTimer();

  timerInterval=setInterval(()=>{

    timeLeft--;

    updateTimer();

    if(timeLeft<=0){

      clearInterval(timerInterval);

      timeExpired();
    }

  },1000);
}


function updateTimer(){

  document.getElementById("timer")
    .textContent=timeLeft;
}


/* =========================================================
   ANSWER
========================================================= */

function answerQuestion(originalIndex,button){

  clearInterval(timerInterval);

  const q=sessionQuestions[currentQuestion];

  const buttons=
    document.querySelectorAll(".answer-btn");

  buttons.forEach(b=>{
    b.disabled=true;
  });

  if(originalIndex===q.correct){

    scoreCorrect++;

    button.classList.add("correct-answer");

    markQuestion(true);

  }else{

    button.classList.add("wrong-answer");

    buttons.forEach(b=>{

      if(
        b.textContent===
        q.a[q.correct]
      ){
        b.classList.add("correct-answer");
      }

    });

    wrongAnswers.push({
      number:currentQuestion+1,
      question:q.q,
      userAnswer:q.a[originalIndex],
      correctAnswer:q.a[q.correct]
    });

    markQuestion(false);
  }

  setTimeout(nextQuestion,700);
}


/* =========================================================
   TIME EXPIRED
========================================================= */

function timeExpired(){

  const q=sessionQuestions[currentQuestion];

  const buttons=
    document.querySelectorAll(".answer-btn");

  buttons.forEach(b=>b.disabled=true);

  buttons.forEach(b=>{

    if(
      b.textContent===
      q.a[q.correct]
    ){
      b.classList.add("correct-answer");
    }

  });

  wrongAnswers.push({
    number:currentQuestion+1,
    question:q.q,
    userAnswer:translations[currentLanguage].timeout,
    correctAnswer:q.a[q.correct]
  });

  markQuestion(false);

  setTimeout(nextQuestion,700);
}


/* =========================================================
   MARK QUESTION
========================================================= */

function markQuestion(isCorrect){

  const el=
    document.getElementById("qnum-"+currentQuestion);

  if(!el) return;

  el.classList.remove("current");

  if(isCorrect){
    el.classList.add("correct");
  }else{
    el.classList.add("wrong");
  }
}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

  currentQuestion++;

  if(currentQuestion>=sessionQuestions.length){

    finishQuiz();

  }else{

    showQuestion();
  }
}


/* =========================================================
   FINISH
========================================================= */

function finishQuiz(){

  clearInterval(timerInterval);

  document.getElementById("quizScreen")
    .classList.add("hidden");

  document.getElementById("resultScreen")
    .classList.remove("hidden");

  const t=translations[currentLanguage];

  /*
    25 questions.
    Each question = 4 points.
    Total = 100.
  */
  const finalScore=scoreCorrect*4;

  const passed=scoreCorrect>=20;

  document.getElementById("resultIcon")
    .textContent=passed ? "🏆" : "❌";

  document.getElementById("resultTitle")
    .textContent=
      passed ? t.passed : t.failed;

  document.getElementById("resultTitle")
    .className=passed ? "pass" : "fail";

  document.getElementById("finalScore")
    .textContent=
      `${t.score}: ${finalScore}/100`;

  document.getElementById("resultDetails")
    .innerHTML=
      `<strong>${t.correctCount}:</strong> ${scoreCorrect}/25
       <br>
       <strong>${t.wrongCount}:</strong> ${wrongAnswers.length}/25`;

  const list=document.getElementById("wrongList");

  list.innerHTML="";

  if(wrongAnswers.length>0){

    const title=document.createElement("h3");

    title.textContent=
      `${t.wrongCount}: ${wrongAnswers.length}`;

    list.appendChild(title);

    wrongAnswers.forEach(item=>{

      const div=document.createElement("div");

      div.className="wrong-item";

      div.innerHTML=`
        <strong>${t.question} ${item.number}</strong>
        <p>${item.question}</p>
        <p>
          <strong>${t.yourAnswer}:</strong>
          ${item.userAnswer}
        </p>
        <p>
          <strong>${t.correct}:</strong>
          ${item.correctAnswer}
        </p>
      `;

      list.appendChild(div);
    });

  }else{

    const perfect=document.createElement("p");

    perfect.textContent=
      currentLanguage==="en"
      ? "Excellent! You answered all questions correctly."
      : currentLanguage==="ar"
      ? "ممتاز! أجبت عن جميع الأسئلة بشكل صحيح."
      : currentLanguage==="badini"
      ? "Pir baş! Tu hemû pirsên rast bersiv da."
      : "زۆر باشە! هەموو پرسیارەکانت بە ڕاستی وەڵام دا.";

    list.appendChild(perfect);
  }

  document.getElementById("newTestBtn")
    .textContent=t.newTest;
}


/* =========================================================
   NEW TEST
========================================================= */

function newTest(){

  document.getElementById("resultScreen")
    .classList.add("hidden");

  document.getElementById("nameScreen")
    .classList.remove("hidden");

  const t=translations[currentLanguage];

  document.getElementById("nameTitle").textContent=t.nameTitle;
  document.getElementById("nameSub").textContent=t.nameSub;
  document.getElementById("fullName").placeholder=t.namePlaceholder;
  document.getElementById("beginQuizBtn").textContent=t.begin;

  document.getElementById("fullName").value="";
}


/* =========================================================
   ENTER KEY
========================================================= */

document.getElementById("fullName")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){
    startQuiz();
  }

});
