/* =====================================================
   Shuffle
   ===================================================== */

function shuffle(array){
  let arr=[...array];

  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }

  return arr;
}

/* =====================================================
   هەڵبژاردنی 25 پرسیار
   ===================================================== */

let selectedQuestions=[];

function createNewQuiz(){

  /*
    25 پرسیاری هەڵدەبژێرێت لە 80 دانە.
    لە هەر جارەی نوێکردنەوەدا shuffle دەکرێن.
  */

  selectedQuestions=shuffle(allQuestions).slice(0,25);

  /*
    هەڵبژاردەکانی هەر پرسیارەکەش shuffle دەکرێن
    بۆ ئەوەی وەڵامی ڕاست هەمیشە لە شوێنی یەکەم نەبێت.
  */

  selectedQuestions=selectedQuestions.map(question=>{

    const choices=question.a.map((text,index)=>({
      text:text,
      correct:index===question.c
    }));

    const mixed=shuffle(choices);

    return {
      q:question.q,
      choices:mixed
    };

  });
}

/* =====================================================
   Variables
   ===================================================== */

let current=0;
let score=0;
let selected=null;
let timeLeft=60;
let timerInterval=null;

/* =====================================================
   Start
   ===================================================== */

createNewQuiz();
showQuestion();

/* =====================================================
   Show Question
   ===================================================== */

function showQuestion(){

  clearInterval(timerInterval);

  selected=null;
  timeLeft=60;

  document.getElementById("counter").textContent =
    (current+1)+" / 25";

  document.getElementById("timer").textContent =
    formatTime(timeLeft);

  const q=selectedQuestions[current];

  document.getElementById("question").textContent=q.q;

  const options=document.getElementById("options");

  options.innerHTML="";

  q.choices.forEach((choice,index)=>{

    const btn=document.createElement("button");

    btn.className="option";

    btn.textContent =
      String.fromCharCode(65+index)+" ـ "+choice.text;

    btn.onclick=()=>selectAnswer(index);

    options.appendChild(btn);

  });

  document.getElementById("nextBtn").disabled=true;

  updateProgress();

  startTimer();
}

/* =====================================================
   Answer
   ===================================================== */

function selectAnswer(index){

  selected=index;

  const buttons=document.querySelectorAll(".option");

  buttons.forEach((button,i)=>{

    button.classList.remove("selected");

    if(i===index){
      button.classList.add("selected");
    }

  });

  document.getElementById("nextBtn").disabled=false;
}

/* =====================================================
   Next
   ===================================================== */

document.getElementById("nextBtn").onclick=function(){

  if(selected===null) return;

  if(selectedQuestions[current].choices[selected].correct){
    score++;
  }

  current++;

  if(current>=25){

    finishQuiz();

  }else{

    showQuestion();

  }

};

/* =====================================================
   Timer
   ===================================================== */

function startTimer(){

  timerInterval=setInterval(()=>{

    timeLeft--;

    document.getElementById("timer").textContent =
      formatTime(timeLeft);

    if(timeLeft<=0){

      clearInterval(timerInterval);

      /*
        ئەگەر کات تەواو بوو وەڵام نەدرا،
        ڕاستەوخۆ دەچێتە پرسیاری داهاتوو.
      */

      if(current<25){

        current++;

        if(current>=25){
          finishQuiz();
        }else{
          showQuestion();
        }

      }

    }

  },1000);
}

/* =====================================================
   Format Time
   ===================================================== */

function formatTime(seconds){

  const m=Math.floor(seconds/60);

  const s=seconds%60;

  return String(m).padStart(2,"0")+":"+
         String(s).padStart(2,"0");
}

/* =====================================================
   Progress
   ===================================================== */

function updateProgress(){

  const percent=(current/25)*100;

  document.getElementById("progress").style.width=
    percent+"%";
}

/* =====================================================
   Finish
   ===================================================== */

function finishQuiz(){

  clearInterval(timerInterval);

  const percent=Math.round((score/25)*100);

  let message="";

  if(percent>=80){
    message="👏 زۆر باش! ئاستی تۆ باشە.";
  }else if(percent>=60){
    message="👍 باشە، بەڵام پێویستی بە ڕاهێنانی زیاتر هەیە.";
  }else{
    message="📚 پێویستە زیاتر ڕاهێنان بکەیت.";
  }

  document.getElementById("quizCard").innerHTML=`

    <div class="result">

      <h2>تاقیکردنەوە تەواو بوو ✅</h2>

      <div class="score">
        ${score} / 25
      </div>

      <h3>
        ڕێژەی سەرکەوتن: ${percent}%
      </h3>

      <p>${message}</p>

      <button class="restart" onclick="newQuiz()">
        🔄 تاقیکردنەوەی نوێ
      </button>

    </div>

  `;

}

/* =====================================================

    <div id="options"></div>

    </button>

  `;

  createNewQuiz();

  /*
    دووبارە event ـی button دانانێین
  */

  document.getElementById("nextBtn").onclick=function(){

    if(selected===null) return;

    if(selectedQuestions[current].choices[selected].correct){
      score++;
    }

    current++;

    if(current>=25){
      finishQuiz();
    }else{
      showQuestion();
    }

  };

  showQuestion();
}
