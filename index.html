<style>
*{box-sizing:border-box}

body{

display:flex;
align-items:center;

.box{

h1{

.sub{

.timer{

}

.progress div{

background:#1976d2;
width:0%;

}

.question{
font-size:21px;
font-weight:bold;
line-height:1.8;

}

.answer{

width:100%;
padding:15px;
margin:9px 0;
border:2px solid #ddd;
border-radius:12px;
background:#fff;
font-size:17px;
text-align:right;

}

.answer:hover{
background:#eef5ff;
}

.answer.selected{
background:#1976d2;
color:#fff;

.answer.correct{

border-color:#2e7d32;

.answer.wrong{

color:#fff;
border-color:#c62828;

.next{
width:100%;
border:0;
border-radius:12px;
padding:15px;
background:#1976d2;
color:#fff;
font-size:18px;
margin-top:10px;
cursor:pointer;
}

.next:disabled{
background:#aaa;
}

.result{
text-align:center;
}

.result .score{
font-size:45px;
font-weight:bold;
color:#1976d2;
margin:15px;
}

.restart{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#1976d2;
color:#fff;
font-size:18px;
cursor:pointer;
}

.note{

color:#777;
text-align:center;
margin-top:15px;

let current=0;
let score=0;
let answered=false;
let time=60;
let timer=null;

const qEl=document.getElementById("question");
const aEl=document.getElementById("answers");
const next=document.getElementById("next");
const timeEl=document.getElementById("time");
const numEl=document.getElementById("num");
const bar=document.getElementById("bar");

function load(){

answered=false;
next.disabled=true;
time=60;
timeEl.textContent=time;

let q=questions[current];

numEl.textContent=
"پرسیاری "+(current+1)+" لە "+questions.length;

qEl.textContent=q[0];
aEl.innerHTML="";

q[1].forEach((text,i)=>{

let btn=document.createElement("button");
btn.className="answer";
btn.textContent=
String.fromCharCode(65+i)+" ـ "+text;

btn.onclick=()=>choose(btn,i);

aEl.appendChild(btn);

});

bar.style.width=
((current/questions.length)*100)+"%";

clearInterval(timer);

timer=setInterval(()=>{

time--;
timeEl.textContent=time;

if(time<=0){

clearInterval(timer);

if(!answered){
answered=true;
next.disabled=false;
}

}

},1000);

}

function choose(btn,index){

if(answered)return;

answered=true;

let correct=questions[current][2];

document.querySelectorAll(".answer")
.forEach((b,i)=>{

b.disabled=true;

if(i===correct)
b.classList.add("correct");

});

if(index===correct){

score++;

btn.classList.add("correct");

}else{

btn.classList.add("wrong");

}

next.disabled=false;

clearInterval(timer);

}

next.onclick=()=>{

current++;

if(current<questions.length){

load();

}else{

result();

}

};

function result(){

clearInterval(timer);

let percent=
Math.round(score/questions.length*100);

let message="";

if(percent>=90)
message="🏆 نایابە! ئاستی زانیاریت زۆر باشە.";

else if(percent>=75)
message="👏 زۆر باشە! بەردەوام بە.";

else if(percent>=60)
message="👍 باشە، بەڵام پێویستی بە ڕاهێنانی زیاتر هەیە.";

else
message="💪 جارێکی تر ڕاهێنان بکە و هەوڵ بدە.";

document.getElementById("app").innerHTML=`

<div class="result">

<h1>🏁 تاقیکردنەوە تەواو بوو</h1>

<div class="score">
${score} / ${questions.length}
</div>

<h2>${percent}%</h2>

<p style="font-size:20px">
${message}
</p>

<button class="restart" onclick="location.reload()">
🔄 دووبارە دەست پێبکە
</button>

<p class="note">
ئەم تاقیکردنەوەیە بۆ ڕاهێنانە و نابێت وەک
وەشانی فەرمی و نهێنیی پرسیارەکانی تاقیکردنەوەی هاتووچۆ لێک بدرێتەوە.
</p>

</div>
`;

}

load();

</script>
