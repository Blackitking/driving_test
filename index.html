<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Driving Theory Test</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#eef1f5;font-family:Arial,sans-serif;color:#222
}
.container{max-width:700px;margin:auto;padding:15px}
.card{
background:white;border-radius:18px;padding:22px;margin-top:20px;
box-shadow:0 4px 18px #0002
}
h1,h2{text-align:center}
button{
width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;
background:#1769e0;color:white;font-size:17px
}
.lang{background:white;color:#222;border:2px solid #ddd}
input{
width:100%;padding:14px;border:1px solid #bbb;border-radius:10px;
font-size:18px;margin-top:10px;text-align:center
}
.hidden{display:none}
.option{
background:#f5f5f5;color:#111;border:2px solid #ddd;
text-align:right
}
.option.correct{background:#b8f3c2;border-color:#168b2b}
.option.wrong{background:#222;color:white;border-color:#222}
#timer{text-align:center;font-size:32px;font-weight:bold;margin:10px}
#progress{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.qnum{
width:27px;height:27px;border-radius:50%;background:#ddd;
display:flex;align-items:center;justify-content:center;font-size:12px
}
.qnum.correct{background:#16a34a;color:white}
.qnum.wrong{background:#111;color:white}
.result{text-align:center;font-size:26px;font-weight:bold}
.wrongBox{
background:#f3f3f3;padding:12px;border-radius:10px;margin-top:10px
}
</style>
</head>

<body>
<div class="container">

<!-- LANGUAGE -->
<div id="language" class="card">
<h2>🌍</h2>
<h2>تکایە زمانێک هەڵبژێرە</h2>

<button class="lang" onclick="chooseLang('ku')">🇹🇯 کوردی سۆرانی</button>
<button class="lang" onclick="chooseLang('badini')">🇹🇯 کوردی بادینی</button>
<button class="lang" onclick="chooseLang('ar')">🇮🇶 العربية</button>
<button class="lang" onclick="chooseLang('en')">🇬🇧 English</button>
</div>

<!-- LOGIN -->
<div id="login" class="card hidden">
<h2 id="loginTitle"></h2>
<input id="code" type="text" inputmode="numeric" maxlength="4"
placeholder="">
<button onclick="login()" id="loginBtn"></button>
<p id="loginMsg" style="text-align:center;color:red"></p>
</div>

<!-- WELCOME -->
<div id="welcome" class="card hidden">
<h2 id="welcomeTitle"></h2>
<p id="welcomeText"></p>
<button onclick="showName()" id="startBtn"></button>
</div>

<!-- NAME -->
<div id="nameBox" class="card hidden">
<h2 id="nameTitle"></h2>
<input id="name" type="text">
<button onclick="startQuiz()" id="beginBtn"></button>
</div>

<!-- QUIZ -->
<div id="quiz" class="card hidden">
<div id="progress"></div>
<div id="timer">60</div>
<h2 id="question"></h2>
<div id="options"></div>
</div>

<!-- RESULT -->
<div id="resultBox" class="card hidden">
<div id="result" class="result"></div>
<p id="score" style="text-align:center"></p>
<p id="wrongCount" style="text-align:center"></p>
<div id="wrongQuestions"></div>
<button onclick="location.reload()" id="againBtn"></button>
</div>

</div>

function chooseLang(x){
lang=x;

document.getElementById("language").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");

document.documentElement.lang=x==="ar"?"ar":x==="en"?"en":"ku";
document.documentElement.dir=x==="ar"||x==="ku"?"rtl":"ltr";

document.getElementById("loginTitle").textContent=UI[x].login;
document.getElementById("loginBtn").textContent=UI[x].loginBtn;
document.getElementById("code").placeholder=UI[x].placeholder;
}

/* =========================
   LOGIN
========================= */

function login(){

const code=document.getElementById("code").value.trim();

if(!ACCESS_CODES.includes(code)){
document.getElementById("loginMsg").textContent=UI[lang].bad;
return;
}

/*
 IMPORTANT:
 This remembers the used code on this browser.
*/
let used=JSON.parse(localStorage.getItem("usedCodes")||"[]");

if(used.includes(code)){
document.getElementById("loginMsg").textContent=UI[lang].bad;
return;
}

used.push(code);
localStorage.setItem("usedCodes",JSON.stringify(used));

document.getElementById("login").classList.add("hidden");
document.getElementById("welcome").classList.remove("hidden");

document.getElementById("welcomeTitle").textContent=UI[lang].welcome;
document.getElementById("welcomeText").textContent=UI[lang].welcomeText;
document.getElementById("startBtn").textContent=UI[lang].start;
}
