<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
body{

    background:#f1f3f6;
    margin:0;
    padding:20px;
}
.box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 4px 15px #0002;
}
button{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:0;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}
.lang{
    background:white;
    border:2px solid #ddd;
}
.answer{
    background:#f3f3f3;
    text-align:right;
}

}
</style>
</head>

<body>

<div class="box">

<!-- LANGUAGE -->

<h2 id="chooseLanguage">تکایە زمانێک هەڵبژێرە</h2>

<button class="lang" onclick="setLanguage('ku')">
🇹🇯 کوردی سۆرانی
</button>

<button class="lang" onclick="setLanguage('badini')">

</button>

🇮🇶 العربية

<button class="lang" onclick="setLanguage('en')">
🇬🇧 English

</div>

<!-- QUIZ -->

<h2 id="question"></h2>

<div id="answers"></div>

</div>

<script>

/* =========================

========================= */

},

},

},

{

},

q:"Sewarek ji bo veguhastina kesan li hember kirê hatiye amadekirin",

},
ar:{
q:"مركبة مخصصة لنقل الأشخاص مقابل أجرة",
a:["سيارة خاصة","شاحنة","تاكسي"]
},
en:{
q:"A vehicle designed to transport people for a fare",
a:["Private car","Truck","Taxi"]
},
correct:2
},

{
ku:{
q:"شانی ڕێگا چیە؟",
a:[
"ئەو بەشەی ڕێگایە کە ڕاستەوخۆ دەکەوێتە تەنیشتی ڕێگاکە",
"بەشێکی ڕێگایە بۆ ڕۆیشتنی یەک ڕیز ئۆتۆمبێلی یەک لە دوای یەک",
"ئەو بەشەی ڕێگایە کە دەکەوێتە دەستە ڕاست و چەپی ڕێگاوە"
]
},
badini:{
q:"Milê rê çi ye?",
a:[
"Beşa rê ye ku rasterast li kêleka rê ye",
"Beşa rê ye ji bo rêçûna yek rêza otomobîlan",
"Beşa rê ye ku li rast û çepê rê ye"
]
},
ar:{
q:"ما هو كتف الطريق؟",
a:[
"الجزء من الطريق الذي يقع مباشرة بجانب الطريق",
"جزء من الطريق لسير صف واحد من السيارات",
"الجزء من الطريق الموجود على يمين ويسار الطريق"
]
},
en:{
q:"What is the road shoulder?",
a:[
"The part of the road directly beside the roadway",
"A part of the road for one line of vehicles",
"The part of the road on the right and left sides"
]
},

},

{
ku:{
q:"ژمارەی تەلەفۆنی فریا گوزاری (ئەمبوڵانس) چەندە؟",
a:["122","104","188"]
},
badini:{
q:"Hejmara telefona ambulansê çi ye?",
a:["122","104","188"]
},
ar:{
q:"ما رقم هاتف الإسعاف؟",
a:["122","104","188"]
},
en:{
q:"What is the ambulance telephone number?",
a:["122","104","188"]
},
correct:0
},

{
ku:{
q:"ڕەگەزە سەرەکیەکانی دروستبونی ئاگر بریتین لە",
a:["گەرمی و ئۆکسجین و ماددە","بەنزین","گاز"]
},
badini:{
q:"Hêmayên bingehîn ên çêbûna agirê çi ne?",
a:["Germî, oksîjen û madde","Benzîn","Gaz"]
},
ar:{
q:"ما هي العناصر الأساسية لحدوث الحريق؟",
a:["الحرارة والأكسجين والمادة","البنزين","الغاز"]
},
en:{
q:"What are the main elements necessary for fire?",
a:["Heat, oxygen and fuel","Petrol","Gas"]
},
correct:0
}

];


/* =========================
   LANGUAGE SYSTEM
========================= */

let currentLanguage="ku";

const languageNames={
ku:"کوردی سۆرانی",
badini:"کوردی بادینی",
ar:"العربية",
en:"English"
};

function setLanguage(language){

currentLanguage=language;

document.getElementById("languages").style.display="none";
document.getElementById("quiz").style.display="block";

if(language==="ar"){
document.documentElement.dir="rtl";
document.documentElement.lang="ar";
}
else if(language==="ku" || language==="badini"){
document.documentElement.dir="rtl";
document.documentElement.lang="ku";
}
else{
document.documentElement.dir="ltr";
document.documentElement.lang="en";
}

showQuestion();
}


/* =========================
   SHOW QUESTION
========================= */

let currentQuestion=0;

function showQuestion(){

const item=questions[currentQuestion][currentLanguage];

document.getElementById("question").textContent=item.q;

const answers=document.getElementById("answers");

answers.innerHTML="";

item.a.forEach((answer,index)=>{

const button=document.createElement("button");

button.className="answer";

button.textContent=answer;

button.onclick=function(){

if(index===questions[currentQuestion].correct){
button.style.background="#b9f6c3";
}
else{
button.style.background="#222";
button.style.color="white";
}

};

answers.appendChild(button);

});

}

</script>

</body>
</html>
